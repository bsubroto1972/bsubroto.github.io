<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Magnus | Creating Artful Spaces</title>
    <!-- Google Fonts for High-End Editorial Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-teal: #49B6B4;   
            --brand-gold: #F6BC3B;   
            --brand-dark: #2A2A2B;   
            --light-bg: #F4F7F6;     
            --card-bg: #FFFFFF;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FFFFFF;
            color: var(--brand-dark);
            line-height: 1.7;
        }
        /* Fixed High-End Navigation Bar */
        header {
            background-color: #FFFFFF;
            border-bottom: 1px solid #EDEDED;
            padding: 15px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .header-logo {
            height: 55px;
            width: auto;
        }
        .nav-links a {
            color: var(--brand-dark);
            text-decoration: none;
            margin-left: 35px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--brand-teal);
        }
        /* HomeLane-Inspired Hero Layout (Open, High-Contrast Space) */
        .hero {
            background: linear-gradient(rgba(255, 255, 255, 0.90), rgba(255, 255, 255, 0.93)), url('https://unsplash.com') no-repeat center center/cover;
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            border-bottom: 1px solid #EAEAEA;
        }
        .hero-logo {
            height: 130px;
            width: auto;
            margin-bottom: 25px;
        }
        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--brand-dark);
            margin-bottom: 10px;
        }
        .hero .tagline {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--brand-gold);
            font-weight: 700;
            margin-bottom: 25px;
        }
        .hero p {
            font-size: 18px;
            max-width: 800px;
            color: #555557;
            margin-bottom: 35px;
        }
        .cta-btn {
            background-color: var(--brand-teal);
            color: white;
            padding: 16px 45px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 13px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(73, 182, 180, 0.3);
        }
        .cta-btn:hover {
            background-color: #3aa19f;
            transform: translateY(-2px);
        }
        /* HomeLane Feature Highlight Bar Setup */
        .trust-bar {
            background-color: #FFFFFF;
            border-bottom: 1px solid #EDEDED;
            padding: 40px 6%;
            text-align: center;
        }
        .trust-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
        }
        .trust-item h3 {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: var(--brand-teal);
            margin-bottom: 5px;
        }
        .trust-item p {
            font-size: 14px;
            font-weight: 600;
            color: #777779;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Core Capabilities Segment */
        .section-container {
            padding: 90px 6%;
            max-width: 1400px;
            margin: 0 auto;
        }
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--brand-dark);
        }
        .subtitle-line {
            width: 70px;
            height: 3px;
            background: var(--brand-teal);
            margin: 0 auto 50px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }
        .card {
            background: var(--card-bg);
            padding: 50px 35px;
            border-radius: 4px;
            border: 1px solid #ECECEC;
            text-align: center;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--brand-teal);
            box-shadow: 0 15px 40px rgba(0,0,0,0.04);
        }
        .card h3 {
            font-size: 22px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .card p {
            font-size: 15px;
            color: #666668;
        }
        /* Production Project Portfolio Gallery Box System */
        .gallery-section {
            background-color: #FAFAFB;
            border-top: 1px solid #EDEDED;
            border-bottom: 1px solid #EDEDED;
            padding: 90px 6%;
        }
        .gallery-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 30px;
        }
        .gallery-item {
            background: #FFFFFF;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #EAEAEA;
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
        }
        .gallery-image-wrapper {
            height: 280px;
            overflow: hidden;
            background-color: #EAEAEA;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.04);
        }
        .gallery-caption {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #ECECEC;
        }
        .gallery-caption h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--brand-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* High-Converting Studio Inquiry & Form Block */
        .contact-section {
            background-color: #FFFFFF;
            padding: 90px 6%;
        }
        .contact-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 60px;
            align-items: center;
        }
        .contact-info h2 {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            margin-bottom: 20px;
            color: var(--brand-dark);
        }
        .contact-info p {
            font-size: 16px;
            color: #555557;
            margin-bottom: 35px;
        }
        .info-row {
            margin-bottom: 15px;
            font-size: 16px;
            color: #3A3A3C;
        }
        .info-row strong {
            color: var(--brand-teal);
        }
        .contact-form form {
            background: #FAFAFB;
            padding: 40px;
            border-radius: 4px;
            border: 1px solid #E2E2E2;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            background: #FFFFFF;
            border: 1px solid #D1D1D6;
            border-radius: 4px;
            color: var(--brand-dark);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--brand-teal);
            outline: none;
        }
        .submit-btn {
            background-color: var(--brand-dark);
            color: white;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: var(--brand-teal);
        }
        footer {
            background-color: #1F1F20;
            color: #8E8E93;
            text-align: center;
            padding: 40px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Structure -->
    <header>
        <img src="IMG_7045.jpg" alt="Interior Magnus Logo" class="header-logo">
        <nav class="nav-links">
