<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Magnus | Creating Artful Spaces</title>
    <!-- Google Fonts for High-End Luxury Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-teal: #49B6B4;   
            --brand-gold: #F6BC3B;   
            --brand-dark: #2A2A2B;   
            --light-bg: #FDFDFD;     
            --card-bg: #FFFFFF;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light-bg);
            color: var(--brand-dark);
            line-height: 1.8;
        }
        /* Luxury Header Navigation */
        header {
            background-color: #FFFFFF;
            border-bottom: 1px solid #EAEAEA;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .header-logo {
            height: 65px;
            width: auto;
        }
        .nav-links a {
            color: var(--brand-dark);
            text-decoration: none;
            margin-left: 35px;
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--brand-teal);
        }
        /* High-Impact Premium Hero Section */
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), url('https://unsplash.com') no-repeat center center/cover;
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }
        .hero-logo {
            height: 140px;
            width: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.3));
        }
        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        .hero .tagline {
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--brand-gold);
            font-weight: 700;
            margin-bottom: 30px;
        }
        .hero p {
            font-size: 20px;
            max-width: 800px;
            margin-bottom: 40px;
            font-weight: 300;
            light-height: 1.6;
        }
        .cta-btn {
            background-color: var(--brand-teal);
            color: white;
            padding: 16px 45px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(73, 182, 180, 0.4);
        }
        .cta-btn:hover {
            background-color: #3aa19f;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(73, 182, 180, 0.6);
        }
        /* Services Section Layout */
        .section-container {
            padding: 100px 8%;
            max-width: 1400px;
            margin: 0 auto;
        }
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .subtitle-line {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--brand-teal), var(--brand-gold));
            margin: 0 auto 60px;
            border-radius: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }
        .card {
            background: var(--card-bg);
            padding: 50px 35px;
            border-radius: 12px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.04);
            border-top: 5px solid var(--brand-gold);
            text-align: center;
            transition: all 0.3s ease;
        }
        .card:nth-child(even) {
            border-top: 5px solid var(--brand-teal);
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
        }
        .card h3 {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .card p {
            font-size: 16px;
            color: #666;
        }
        /* Stunning Inspiration Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
        }
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            height: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .gallery-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            display: flex;
            align-items: flex-end;
            padding: 30px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
        .gallery-overlay h4 {
            color: white;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        /* Functional Studio Contact Form Layout */
        .contact-section {
            background-color: #1F1F20;
            color: white;
            padding: 90px 8%;
        }
        .contact-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 60px;
        }
        .contact-info h2 {
            font-family: 'Cinzel', serif;
            font-size: 38px;
            margin-bottom: 20px;
            color: #FFF;
        }
        .contact-info p {
            font-size: 16px;
            color: #B0B0B2;
            margin-bottom: 30px;
        }
        .info-details {
            margin-top: 30px;
        }
        .info-row {
            margin-bottom: 20px;
            font-size: 18px;
        }
        .info-row strong {
            color: var(--brand-gold);
        }
        /* Modern Input Form fields */
        .contact-form form {
            background: #2A2A2B;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #3A3A3B;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            background: #1F1F20;
            border: 1px solid #4A4A4B;
            border-radius: 6px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--brand-teal);
            outline: none;
        }
        .submit-btn {
            background-color: var(--brand-teal);
            color: white;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #3aa19f;
        }
        footer {
            background-color: #151516;
            color: #757577;
            text-align: center;
            padding: 30px;
            font-size: 14px;
            border-top: 1px solid #252526;
        }
    </style>
</head>
<body>

    <header>
        <img src="IMG_7045.jpg" alt="Interior Magnus Logo" class="header-logo">
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <img src="IMG_7045.jpg" alt="Interior Magnus Badge" class="hero-logo">
        <h1>INTERIOR MAGNUS</h1>
        <div class="tagline">Creating Artful Spaces</div>
        <p>A premium interior architecture and styling firm specializing in bespoke residential, modern commercial spaces, and seamless turnkey design executions.</p>
        <a href="#contact" class="cta-btn">Inquire Now</a>
    </section>

    <section class="section-container" id="services">
        <h2 class="section-title">Our Capabilities</h2>
        <div class="subtitle-line"></div>
        <div class="grid">
