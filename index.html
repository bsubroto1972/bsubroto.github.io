<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Magnus | Creating Artful Spaces</title>
    <!-- Premium Font Integration -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@600;800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-teal: #49B6B4;   
            --brand-gold: #F6BC3B;   
            --brand-dark: #2C2C2E;   
            --light-bg: #FAFAFA;     
            --card-bg: #FFFFFF;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth; /* Makes all menu buttons scroll smoothly down */
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #FFFFFF;
            color: var(--brand-dark);
            line-height: 1.7;
        }
        /* Fixed Luxury Navigation Bar */
        header {
            background-color: #FFFFFF;
            border-bottom: 1px solid #EDEDED;
            padding: 15px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .header-logo {
            height: 55px;
            width: auto;
        }
        .nav-links a {
            color: var(--brand-dark);
            text-decoration: none;
            margin-left: 35px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: var(--brand-teal);
        }
        /* HomeLane-Inspired Elegant Hero Section (Bright & Inviting) */
        .hero {
            background: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.92)), url('https://unsplash.com') no-repeat center center/cover;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px;
            border-bottom: 1px solid #E5E5E5;
        }
        .hero-logo {
            height: 120px;
            width: auto;
            margin-bottom: 25px;
        }
        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--brand-dark);
            margin-bottom: 10px;
        }
        .hero .tagline {
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #CBB06D; /* Tailored Warm Gold */
            font-weight: 700;
            margin-bottom: 30px;
        }
        .hero p {
            font-size: 18px;
            max-width: 750px;
            color: #555557;
            margin-bottom: 35px;
            font-weight: 400;
        }
        .cta-btn {
            background-color: var(--brand-teal);
            color: white;
            padding: 16px 45px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 13px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(73, 182, 180, 0.3);
        }
        .cta-btn:hover {
            background-color: #3aa19f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(73, 182, 180, 0.4);
        }
        /* Layout Padding Section Architecture */
        .section-container {
            padding: 100px 6%;
            max-width: 1400px;
            margin: 0 auto;
        }
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--brand-dark);
        }
        .subtitle-line {
            width: 60px;
            height: 3px;
            background: var(--brand-teal);
            margin: 0 auto 50px;
        }
        /* Grid Alignment Matrix */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }
        .card {
            background: var(--card-bg);
            padding: 45px 30px;
            border-radius: 4px;
            border: 1px solid #ECECEC;
            text-align: center;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: var(--brand-teal);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }
        .card h3 {
            font-size: 21px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .card p {
            font-size: 15px;
            color: #666668;
        }
        /* Premium Showcase Portfolio Gallery Box System */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .gallery-item {
            background-color: #F0F0F0;
            border-radius: 4px;
            overflow: hidden;
            height: 320px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            border: 1px solid #EAEAEA;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.05);
        }
        .gallery-caption {
            padding: 15px;
            background: #FFFFFF;
            border-top: 1px solid #ECECEC;
            text-align: center;
        }
        .gallery-caption h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--brand-dark);
        }
        /* Corporate Studio Desk Footer Area & Form Layout */
        .contact-section {
            background-color: #F9F9FB;
            border-top: 1px solid #EDEDED;
            padding: 100px 6%;
        }
        .contact-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 50px;
            align-items: center;
        }
        .contact-info h2 {
            font-family: 'Cinzel', serif;
            font-size: 34px;
            margin-bottom: 20px;
            color: var(--brand-dark);
        }
        .contact-info p {
            font-size: 16px;
            color: #555557;
            margin-bottom: 30px;
        }
        .info-row {
            margin-bottom: 15px;
            font-size: 16px;
            color: #3A3A3C;
        }
        .info-row strong {
            color: var(--brand-teal);
        }
        /* Clean Input Box Configurations */
        .contact-form form {
            background: #FFFFFF;
            padding: 40px;
            border-radius: 4px;
            border: 1px solid #E2E2E2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 14px;
            background: #FAFAFA;
            border: 1px solid #D1D1D6;
            border-radius: 4px;
            color: var(--brand-dark);
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            transition: border 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--brand-teal);
            outline: none;
            background: #FFFFFF;
        }
        .submit-btn {
            background-color: var(--brand-dark);
            color: white;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: var(--brand-teal);
        }
        footer {
            background-color: #FFFFFF;
            color: #8E8E93;
            text-align: center;
            padding: 35px;
            font-size: 13px;
            border-top: 1px solid #EDEDED;
        }
    </style>
</head>
<body>

    <!-- Top Sticky Navigation Bar -->
    <header>
        <img src="IMG_7045.jpg" alt="Interior Magnus Logo" class="header-logo">
        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Clean, Open Hero Space -->
    <section class="hero" id="home">
        <img src="IMG_7045.jpg" alt="Interior Magnus Emblem" class="hero-logo">
        <h1>INTERIOR MAGNUS</h1>
        <div class="tagline">Creating Artful Spaces</div>
        <p>A premium design studio delivering custom end-to-end residential interiors, workspace architecture, and complete modular execution configurations tailored perfectly to your lifestyle.</p>
        <a href="#contact" class="cta-btn">Inquire Now</a>
